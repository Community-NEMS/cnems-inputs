[project]
site_name = "cnems-inputs"
site_description = "Data pipelines that feed inputs into the Community NEMS project."
site_author = "Community NEMS"
site_url = "https://community-nems.github.io/cnems-inputs"
copyright = """
Copyright &copy; 2026 Community NEMS
"""
docs_dir = "docs"

nav = [
    { "Home" = "index.md" },
    { "Tooling" = "tools.md" },
    { "API Reference" = [
        { "Overview" = "reference/index.md" },
        { "logging" = "reference/logging.md" },
        { "datastore" = [
            { "Overview" = "reference/datastore/index.md" },
            { "datastore" = "reference/datastore/datastore.md" },
            { "resource_cache" = "reference/datastore/resource_cache.md" },
            { "runner" = "reference/datastore/runner.md" },
        ] },
    ] },
    { "Release Notes" = "release_notes.md" },
    { "License" = "license.md" },
]

[project.theme]
# No logo/favicon yet -- Community-NEMS doesn't have its own branding, so this uses
# Zensical's defaults rather than borrowing Catalyst Cooperative's.
language = "en"

features = [
    "content.code.copy",
    "navigation.footer",
    "navigation.indexes",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
scheme = "system"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Community-NEMS/cnems-inputs"

# Renders API reference docs from docstrings, via the ::: directives in the pages
# under docs/reference/, using mkdocstrings -- currently a preliminary integration,
# see https://zensical.org/docs/setup/extensions/mkdocstrings/
[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
# Enables shorthand references instead of full Markdown links: `#123` for issues,
# `!123` for pull requests, `@user` for users, and raw commit SHAs -- all resolved
# against the `user`/`repo` below unless another owner/repo is spelled out explicitly.
[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true
social_url_shorthand = true
user = "Community-NEMS"
repo = "cnems-inputs"
[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
