[build-system]
build-backend = "hatchling.build"
requires = ["hatch-vcs>=0.5", "hatchling>=1.31"]

[project]
name = "cnems_inputs"
description = "Data pipelines that feed inputs into the Community NEMS project."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [{ name = "Catalyst Cooperative", email = "pudl@catalyst.coop" }]
requires-python = ">=3.14,<3.15"
dynamic = ["version"]
license = { file = "LICENSE" }
# Intentionally empty: this package is never installed outside of the pixi
# environment defined below, so runtime dependencies are tracked once, as conda
# packages, under [tool.pixi.dependencies] rather than here too.
dependencies = []

[project.scripts]
# Placeholder entry point demonstrating the pattern -- named after the dummy module
# it comes from until real console scripts replace it.
dummy = "cnems_inputs.cli:main"
datastore = "cnems_inputs.datastore.runner:main"

[tool.hatch.version]
# Derive the package version from the latest git tag, rather than storing it in the
# repository and manually updating it.
source = "vcs"

[tool.pytest]
testpaths = ["tests"]
filterwarnings = [
  # Examples of how to filter out pytest warnings from dependencies
  # "ignore:distutils Version classes are deprecated:DeprecationWarning",
]
addopts = ["--verbose"]
log_format = "%(asctime)s [%(levelname)8s] %(name)s:%(lineno)s %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = true
log_cli_level = "DEBUG"
# We don't have any doctests right now, but if we did this would configure
# how those docstrings are interpreted.
doctest_optionflags = [
  "NORMALIZE_WHITESPACE",
  "IGNORE_EXCEPTION_DETAIL",
  "ELLIPSIS",
]

[tool.coverage.report]
precision = 2
sort = "miss"
skip_empty = true
fail_under = 50
# fail_under is enforced once, after unit and integration coverage are combined, by
# the final "coverage report" invocation in the `test` pixi task below -- not here,
# since pytest-cov would otherwise also enforce it after unit or integration tests
# run on their own, before the other suite gets a chance to contribute its coverage.
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",

  # Stuff that's not expected to run normally...
  "logger.debug",
]

[tool.pixi.workspace]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-aarch64", "osx-arm64", "linux-64", "osx-64", "win-64"]

[tool.pixi.pypi-dependencies]
# Install this package itself in editable mode. No extras yet -- optional-dependency
# groups get added here as later PRs bring over the systems that need them (tests,
# lint, type checking, docs).
"cnems_inputs" = { path = ".", editable = true }

# Not on conda-forge, unlike the rest of our development tooling, so it has to come
# from PyPI instead.
mdformat-mkdocs = ">=5" # Stops mdformat from mangling zensical/MkDocs markdown syntax

[tool.pixi.dependencies]
# Runtime dependencies, sourced from conda-forge rather than PyPI wherever available.
# This is the single place these are tracked -- see the note on [project.dependencies]
# above.
duckdb = ">=1.5.5,<2"
email-validator = "*"             # pydantic's email-validation support
frictionless = ">=5.19.0,<6"      # Frictionless data packages and tabular metadata validation
fsspec = "*"                      # pandas' generic remote-filesystem support
gcsfs = "*"                       # pandas' GCS support
openpyxl = "*"                    # pandas' excel support
pandas = ">=3,<4"
pandera = ">=0.32.1"
polars = ">=1.43,<2"
python-snappy = "*"               # pandas' compression support
pyarrow = ">=25.0.0"              # pandas' parquet support
pydantic = ">=2.13.4,<3"
pydantic-settings = ">=2.14.2,<3"
s3fs = "*"                        # pandas' S3 support
snakemake = ">=9.24.0"            # Lightweight orchestration of data pipelines, used to run the CNEMS ETL
zstandard = "*"                   # pandas' compression support
pixi-pycharm = "*"                # support for pixi in PyCharm IDE (temporary?)

# Development tools: pre-commit hooks, linting/formatting, and static analysis. All
# available on conda-forge, so -- like the runtime dependencies above -- these are
# tracked once, here, rather than also being listed as PyPI extras.
actionlint = ">=1.7.12"
markdownlint-cli2 = ">=0.23.1"
mdformat = ">=1.0.0"
mdformat-frontmatter = ">=2.1"
mdformat-gfm = ">=1.0.0"
prek = ">=0.4.10"              # Fast Rust-based pre-commit hook runner
prettier = ">=3.9.3"
pyrefly = ">=1.1.1"            # Fast Rust-based Python type checker
ruff = ">=0.16"                # A very fast python linter & autofixer
# So actionlint's embedded shellcheck integration for GitHub Actions `run:` steps
# actually runs, rather than silently skipping because the binary isn't on PATH.
shellcheck = ">=0.11.0"
taplo = ">=0.10.0"
sqlite = ">=3.53.3,<4"

# Testing and coverage tracking, also available on conda-forge so they're tracked
# here alongside the rest of the development tools rather than as PyPI extras.
coverage = ">=7.15.2"               # Lets us track what code is being tested
pytest = ">=9.1.1"                  # Our testing framework
pytest-console-scripts = ">=1.4.1"  # Allow automatic testing of entry point scripts
pytest-cov = ">=7.1.0"              # Pytest plugin for working with coverage
requests = ">=2.34.2,<3"
pyyaml = ">=6.0.3,<7"
urllib3 = ">=2.7.0,<3"
coloredlogs = ">=15.0.1,<16"
click = ">=8.2.1,<9"
universal-pathlib = ">=0.3.10,<0.4"
boto3 = ">=1.40.70,<2"
responses = ">=0.26.2,<0.27"
pytest-mock = ">=3.15.1,<4"

# Documentation build, also available on conda-forge so it's tracked here alongside
# the rest of the development tools rather than as a PyPI extra.
mkdocstrings-python = ">=2.0.5" # Renders API docs from docstrings, used by zensical
zensical = ">=0.0.51"           # Markdown-based static site generator for docs

[tool.ruff]
# Configurations that apply to both the `format` and `lint` subcommands.
target-version = "py314"
line-length = 88
indent-width = 4

[tool.ruff.format]
# Configuration specific to the `format` subcommand.
# We use black compatible formatting.
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  "A",   # flake8-builtins
  "B",   # flake8-bugbear
  "C",   # Limit cyclomatic complexity using mccabe
  "C4",  # flake8-comprehensions
  "D",   # pydocstyle errors
  "E",   # pycodestyle errors
  "EXE", # executable file issues
  "F",   # pyflakes
  "I",   # isort
  "ICN", # flake8 import conventions
  "N",   # pep8-naming
  "NPY", # NumPy specific checks
  "PD",  # pandas checks
  "PGH", # pygrep-hooks
  "PIE", # flake8-pie miscellaneous linting
  "PTH", # use pathlib
  "Q",   # flake8-quotes
  "RET", # check return values
  "RSE", # unnecessary parenthises on raised exceptions
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade (use modern python syntax)
  "W",   # pycodestyle warnings
]
ignore = [
  "D401",   # Require imperative mood in docstrings.
  "D417",
  "E501",   # Overlong lines.
  "PD010",  # Use of df.stack()
  "PD013",  # Use of df.unstack()
  "PD015",  # Use of pd.merge() rather than df.merge()
  "RET504", # Ignore unnecessary assignment before return
  "S101",   # Use of assert
]
extend-select = ["NPY201"] # preview rule to easy migration to Numpy 2.0

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Ignore unused imports
"tests/*" = ["D"]        # Don't require docstrings in test modules

[tool.ruff.lint.pep8-naming]
# Allow Pydantic's `@validator` decorator to trigger class method treatment.
classmethod-decorators = ["pydantic.validator", "pydantic.root_validator"]

[tool.ruff.lint.isort]
known-first-party = ["cnems_inputs"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
inline-quotes = "double"
multiline-quotes = "double"

[tool.pyrefly]
# Limited to "src" so the pre-commit hook -- which only installs pyrefly itself, not
# the rest of the dependencies -- can still resolve imports.
project-includes = ["src"]
python-version = "3.14"

[tool.typos.default.extend-words]
# Add words that should be excepted from spell-checking
FOM = "FOM"

[tool.pixi.tasks]

# Testing
[tool.pixi.tasks.test-erase]
cmd = "coverage erase"
description = "Wipe previously recorded coverage data before the test suites run."

[tool.pixi.tasks.test-unit]
cmd = "pytest --cov=cnems_inputs --cov-append --cov-report=xml --cov-fail-under=0 --doctest-modules src/cnems_inputs tests/unit"
description = "Run unit tests (and doctests) with coverage instrumentation."

[tool.pixi.tasks.test-integration]
cmd = "pytest --cov=cnems_inputs --cov-append --cov-report=xml --cov-fail-under=0 tests/integration"
description = "Run integration tests with coverage instrumentation."

[tool.pixi.tasks.test]
cmd = "coverage report --sort=cover"
depends-on = ["test-erase", "test-unit", "test-integration"]
description = "Run all tests and report combined coverage, failing if it's below the configured threshold."

# Linting
[tool.pixi.tasks.lint-ruff]
cmd = "ruff check ."
description = "Check code style and correctness with ruff, without modifying files."

[tool.pixi.tasks.lint-pyrefly]
cmd = "pyrefly check src"
description = "Type check the code with pyrefly."

[tool.pixi.tasks.lint]
depends-on = ["lint-ruff", "lint-pyrefly"]
description = "Run all linters and type checks, without modifying files."

# Formatting
[tool.pixi.tasks.format-ruff]
cmd = "ruff format . && ruff check --fix ."
description = "Reformat code and auto-fix lint issues with ruff."

[tool.pixi.tasks.format-toml]
cmd = "taplo fmt pyproject.toml zensical.toml"
description = "Reformat TOML files with taplo."

[tool.pixi.tasks.format-md]
cmd = "mdformat README.md AGENTS.md docs .github/ISSUE_TEMPLATE .github/pull_request_template.md"
description = "Reformat Markdown files with mdformat."

[tool.pixi.tasks.format-yaml]
cmd = "prettier --write '**/*.{yaml,yml}'"
description = "Reformat YAML files with prettier."

[tool.pixi.tasks.format]
depends-on = ["format-ruff", "format-toml", "format-md", "format-yaml"]
description = "Run all formatters, modifying files in place."

# Documentation
[tool.pixi.tasks.docs-clean]
cmd = "rm -rf site/*"
cwd = "./"
description = "Remove all built documentation under site/."

[tool.pixi.tasks.docs-build]
cmd = "zensical build"
description = "Build the documentation with Zensical into site/."

[tool.pixi.tasks.docs-serve]
cmd = "zensical serve"
description = "Serve the documentation locally, rebuilding on changes."

# Pre-commit hook configuration
[tool.pixi.tasks.prek-update]
cmd = "prek update"
description = "Bump `rev` pins for hooks in .pre-commit-config.yaml to their latest versions."
